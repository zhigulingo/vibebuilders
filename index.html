<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibebuilder.ru — закрытый канал по вайб-кодингу</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ============ DESIGN TOKENS ============ */
:root {
  --bg: #07070a;
  --bg-soft: #0d0d12;
  --bg-elevated: #14141b;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --ink: #f4f4f6;
  --ink-dim: #a4a4b0;
  --ink-faint: #6b6b78;
  --accent: #c4ff3d;        /* кислотный лайм */
  --accent-ink: #0a0a0a;
  --accent-soft: rgba(196, 255, 61, 0.12);
  --warn: #ff5c3a;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;
  --display: 'Manrope', 'Inter', system-ui, sans-serif;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 32px;
  --shadow-glow: 0 0 0 1px rgba(196, 255, 61, 0.3), 0 20px 60px -20px rgba(196, 255, 61, 0.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ============ LAYOUT ============ */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 720px) { .container { padding: 0 20px; } }

.section {
  padding: 120px 0;
  position: relative;
}
@media (max-width: 720px) { .section { padding: 72px 0; } }

.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--accent);
}

h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(44px, 6.8vw, 92px); letter-spacing: -0.035em; }
h2 { font-size: clamp(32px, 4.6vw, 60px); letter-spacing: -0.03em; }
h3 { font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -0.02em; }
p { margin: 0; }

.mono { font-family: var(--mono); }

/* ============ NAV ============ */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 80;
  padding: 18px 0;
  backdrop-filter: blur(18px);
  background: rgba(7, 7, 10, 0.6);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s;
}
.nav.scrolled { border-bottom-color: var(--line); background: rgba(7, 7, 10, 0.85); }
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.logo {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.logo-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .6; transform: scale(.8); }
}
.nav-links {
  display: flex;
  gap: 32px;
  font-size: 14px;
  color: var(--ink-dim);
}
.nav-links a:hover { color: var(--ink); }
@media (max-width: 720px) { .nav-links { display: none; } }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 15px;
  transition: transform .15s, box-shadow .2s, background .2s;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-glow);
}
.btn-ghost {
  border: 1px solid var(--line-strong);
  color: var(--ink);
}
.btn-ghost:hover { border-color: var(--ink); background: rgba(255,255,255,0.04); }
.btn-sm { padding: 10px 16px; font-size: 13px; }
.btn-lg { padding: 18px 28px; font-size: 17px; }

/* ============ HERO ============ */
.hero {
  padding: 140px 0 80px;
  position: relative;
  overflow: hidden;
}
.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 80%);
  pointer-events: none;
}
.hero-glow {
  position: absolute;
  width: 800px; height: 800px;
  left: 50%; top: -200px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(196,255,61,0.18) 0%, transparent 60%);
  pointer-events: none;
  filter: blur(40px);
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 1100px;
  margin: 0 auto;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px 8px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-dim);
  margin-bottom: 36px;
}
.hero-badge-pill {
  background: var(--accent);
  color: var(--accent-ink);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.hero h1 .accent {
  color: var(--accent);
  font-style: italic;
  font-weight: 600;
}
.hero h1 .strike {
  position: relative;
  display: inline-block;
  color: var(--ink-dim);
}
.hero h1 .strike::after {
  content: "";
  position: absolute;
  left: -4%; right: -4%;
  top: 52%;
  height: 6px;
  background: var(--warn);
  transform: rotate(-2deg);
}
.hero-sub {
  font-size: clamp(17px, 1.6vw, 21px);
  color: var(--ink-dim);
  max-width: 640px;
  margin: 32px auto 0;
  line-height: 1.5;
  text-wrap: pretty;
}
.hero-cta {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 44px;
  flex-wrap: wrap;
}
.hero-meta {
  display: flex;
  gap: 28px;
  justify-content: center;
  margin-top: 28px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
  flex-wrap: wrap;
}
.hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
.hero-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Hero terminal preview */
.hero-terminal {
  margin: 80px auto 0;
  max-width: 920px;
  position: relative;
  z-index: 2;
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, #0e0e15 0%, #08080c 100%);
  border: 1px solid var(--line);
  box-shadow: 0 40px 100px -30px rgba(0,0,0,0.8), 0 0 0 1px rgba(196,255,61,0.04);
  overflow: hidden;
}
.term-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,0.02);
}
.term-bar .dots { display: flex; gap: 6px; }
.term-bar .dots span {
  width: 11px; height: 11px; border-radius: 50%;
  background: rgba(255,255,255,0.18);
}
.term-bar .title {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 14px;
}
.term-body {
  padding: 28px 32px;
  font-family: var(--mono);
  font-size: 14.5px;
  line-height: 1.85;
  text-align: left;
  min-height: 240px;
}
.term-prompt { color: var(--accent); }
.term-user { color: var(--ink); }
.term-ai { color: var(--ink-dim); }
.term-ai b { color: var(--ink); font-weight: 500; }
.term-cursor {
  display: inline-block;
  width: 9px; height: 16px;
  background: var(--accent);
  vertical-align: -2px;
  animation: blink 1s steps(2) infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ============ MARQUEE ============ */
.marquee {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 24px 0;
  overflow: hidden;
  background: var(--bg-soft);
  position: relative;
}
.marquee-track {
  display: flex;
  gap: 64px;
  white-space: nowrap;
  animation: scroll 40s linear infinite;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink-dim);
}
.marquee-track span {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.marquee-track .star { color: var(--accent); }
@keyframes scroll {
  to { transform: translateX(-50%); }
}

/* ============ FEATURE GRID ============ */
.section-head {
  text-align: center;
  max-width: 760px;
  margin: 0 auto 72px;
}
.section-head h2 { margin-top: 18px; }
.section-head p {
  color: var(--ink-dim);
  margin-top: 22px;
  font-size: 19px;
  text-wrap: pretty;
}

.bento {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
}
.bento .card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--bg-soft);
  padding: 32px;
  position: relative;
  overflow: hidden;
  transition: border-color .2s, transform .2s;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}
.bento .card:hover { border-color: var(--line-strong); }
.bento .c-1 { grid-column: span 4; }
.bento .c-2 { grid-column: span 2; }
.bento .c-3 { grid-column: span 2; }
.bento .c-4 { grid-column: span 2; }
.bento .c-5 { grid-column: span 2; }
.bento .c-6 { grid-column: span 3; }
.bento .c-7 { grid-column: span 3; }
@media (max-width: 920px) {
  .bento { grid-template-columns: 1fr 1fr; }
  .bento .c-1, .bento .c-2, .bento .c-3, .bento .c-4, .bento .c-5, .bento .c-6, .bento .c-7 { grid-column: span 2; }
}

.card-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 24px;
}
.card h3 { font-size: 22px; line-height: 1.2; }
.card p { color: var(--ink-dim); margin-top: 12px; font-size: 15px; line-height: 1.55; }

/* card visual elements */
.viz-pulse {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 60px;
}
.viz-pulse span {
  flex: 1;
  background: var(--accent);
  border-radius: 2px;
  opacity: 0.6;
  animation: viz 1.4s ease-in-out infinite;
}
.viz-pulse span:nth-child(1) { animation-delay: 0s; height: 30%; }
.viz-pulse span:nth-child(2) { animation-delay: .1s; height: 60%; }
.viz-pulse span:nth-child(3) { animation-delay: .2s; height: 45%; }
.viz-pulse span:nth-child(4) { animation-delay: .3s; height: 80%; }
.viz-pulse span:nth-child(5) { animation-delay: .4s; height: 55%; }
.viz-pulse span:nth-child(6) { animation-delay: .5s; height: 90%; }
.viz-pulse span:nth-child(7) { animation-delay: .6s; height: 40%; }
.viz-pulse span:nth-child(8) { animation-delay: .7s; height: 70%; }
.viz-pulse span:nth-child(9) { animation-delay: .8s; height: 50%; }
.viz-pulse span:nth-child(10) { animation-delay: .9s; height: 65%; }
@keyframes viz {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}

.viz-tags {
  margin-top: auto;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.viz-tags span {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  color: var(--ink-dim);
}
.viz-tags span.hot {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}

.viz-stack {
  margin-top: auto;
  position: relative;
  height: 100px;
}
.viz-stack .layer {
  position: absolute;
  width: 80%;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-dim);
}
.viz-stack .layer:nth-child(1) { top: 0; left: 0; }
.viz-stack .layer:nth-child(2) { top: 28px; left: 14%; }
.viz-stack .layer:nth-child(3) { top: 56px; left: 7%; border-color: var(--accent); color: var(--ink); }

/* ============ STEPS / PROGRAM ============ */
.steps {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: start;
}
@media (max-width: 920px) { .steps { grid-template-columns: 1fr; gap: 40px; } }
.steps-list { display: flex; flex-direction: column; gap: 4px; }
.step {
  border-top: 1px solid var(--line);
  padding: 28px 0;
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 24px;
  align-items: baseline;
  cursor: pointer;
  transition: padding .2s;
}
.step:last-child { border-bottom: 1px solid var(--line); }
.step .num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-faint);
}
.step .title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.step .meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.step .desc {
  grid-column: 2 / 4;
  color: var(--ink-dim);
  font-size: 15px;
  margin-top: 8px;
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease, margin-top .35s ease;
}
.step.open .desc { max-height: 200px; margin-top: 14px; }
.step.open .title { color: var(--accent); }
.step:hover .title { color: var(--ink); }
.step.open:hover .title { color: var(--accent); }

.steps-side {
  position: sticky;
  top: 120px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 32px;
  background: var(--bg-soft);
}
.steps-side h4 {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 24px;
}
.steps-side ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.steps-side li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 15px;
  color: var(--ink);
}
.steps-side li::before {
  content: "→";
  color: var(--accent);
  font-family: var(--mono);
}

/* ============ AUTHOR ============ */
.author {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 80px;
  align-items: center;
}
@media (max-width: 920px) { .author { grid-template-columns: 1fr; gap: 40px; } }
.author-img {
  aspect-ratio: 4/5;
  background: linear-gradient(135deg, #1a1a24 0%, #0a0a0e 100%);
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.author-img::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 30%, rgba(196,255,61,0.2), transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(255,92,58,0.15), transparent 50%);
}
.author-avatar {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.1em;
}
.author-avatar svg {
  width: 60%;
  height: 60%;
  opacity: 0.4;
}
.author-tag {
  position: absolute;
  bottom: 24px; left: 24px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-dim);
  background: rgba(0,0,0,0.5);
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.author-content h2 { margin-bottom: 28px; }
.author-content p { color: var(--ink-dim); font-size: 17px; line-height: 1.6; margin-top: 18px; }
.author-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  margin-top: 40px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}
.author-stat .num {
  font-family: var(--display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--accent);
}
.author-stat .lbl {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 4px;
}

/* ============ TESTIMONIALS ============ */
.testimonials {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 920px) { .testimonials { grid-template-columns: 1fr; } }
.t-card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 28px;
  background: var(--bg-soft);
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.t-quote {
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.t-author {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.t-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c4ff3d, #87b522);
  color: var(--accent-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}
.t-meta .name { font-weight: 600; font-size: 14px; }
.t-meta .role { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
.t-card .ship {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* ============ FAQ ============ */
.faq {
  max-width: 820px;
  margin: 0 auto;
}
.faq-item {
  border-top: 1px solid var(--line);
  padding: 28px 0;
  cursor: pointer;
}
.faq-item:last-child { border-bottom: 1px solid var(--line); }
.faq-q {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.faq-q-icon {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 18px;
  transition: transform .25s, background .2s, color .2s;
}
.faq-item.open .faq-q-icon {
  transform: rotate(45deg);
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}
.faq-a {
  color: var(--ink-dim);
  font-size: 16px;
  line-height: 1.6;
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease, margin-top .35s ease;
  padding-right: 56px;
}
.faq-item.open .faq-a { max-height: 240px; margin-top: 14px; }

/* ============ FINAL CTA ============ */
.final {
  text-align: center;
  padding: 140px 32px;
  border-radius: var(--r-xl);
  background:

  // useState-style call doesn't write a "[object Object]" key into the persisted

  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

    </>

}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">

}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}
